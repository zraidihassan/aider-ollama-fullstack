# Docker Compose v2 (le champ 'version' est obsolète).
services:
  ai-agent:
    build: .
    container_name: ai-coding-agent
    restart: "no"
    volumes:
      # PROJECT_PATH est obligatoire : échec explicite s'il est absent.
      - ${PROJECT_PATH:?Définis PROJECT_PATH vers ton projet Spring Boot + Angular}:/project
      - maven-cache:/root/.m2
      - npm-cache:/root/.npm
      - aider-cache:/root/.cache
    environment:
      - MAVEN_OPTS=${MAVEN_OPTS:--Xmx2g -XX:+UseG1GC}
      - OLLAMA_API_BASE=http://host.docker.internal:11434
      # Modèles surchargeables sans toucher aux scripts
      - AIDER_MODEL=${AIDER_MODEL:-ollama/qwen2.5-coder:14b}
      - AIDER_WEAK_MODEL=${AIDER_WEAK_MODEL:-ollama/qwen2.5-coder:14b}
      - MAX_ITER=${MAX_ITER:-3}
    extra_hosts:
      # Permet au conteneur de joindre Ollama qui tourne sur l'hôte.
      - "host.docker.internal:host-gateway"
    ports:
      - "8501:8501"   # Web UI Aider (gui.sh)
    working_dir: /project
    stdin_open: true
    tty: true

volumes:
  maven-cache:
  npm-cache:
  aider-cache:
